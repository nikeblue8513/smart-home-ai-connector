name: Connector checks
on:
  push:
    branches: [main, fix/connector-production-readiness]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp==3.14.5 PyYAML==6.0.3
      - run: python -m unittest discover -s smart_home_ai_connector -v
      - run: python -m compileall -q smart_home_ai_connector
      - name: Check manifest and runtime version agree
        run: |
          python - <<'PY'
          import ast, pathlib, yaml
          root = pathlib.Path('smart_home_ai_connector')
          manifest = yaml.safe_load((root / 'config.yaml').read_text())
          tree = ast.parse((root / 'connector.py').read_text())
          version = next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'CONNECTOR_VERSION' for t in n.targets))
          assert manifest['version'] == version
          assert manifest['ports']['8099/tcp'] is None
          assert manifest['options']['allow_control'] is False
          assert manifest['options']['allow_locks'] is False
          PY
